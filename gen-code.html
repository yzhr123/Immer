<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生成充值码</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #fafafa;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; padding: 20px;
}
.card {
  background: #fff; border-radius: 12px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.06); padding: 40px;
  width: 100%; max-width: 420px;
}
h1 { font-size: 18px; font-weight: 500; color: #333; margin-bottom: 28px; text-align: center; letter-spacing: 0.1em; }
label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; letter-spacing: 0.05em; }
input, select {
  width: 100%; padding: 10px 14px; font-size: 14px;
  border: 1px solid #e0e0e0; border-radius: 6px;
  outline: none; transition: border-color .2s;
  background: #fff; color: #333;
}
input:focus { border-color: #999; }
.field { margin-bottom: 18px; }
.btn {
  width: 100%; padding: 11px; font-size: 14px; font-weight: 500;
  border: none; border-radius: 6px; cursor: pointer;
  background: #222; color: #fff; transition: background .2s;
  letter-spacing: 0.05em;
}
.btn:hover { background: #444; }
.btn:disabled { background: #ccc; cursor: not-allowed; }
.result {
  margin-top: 20px; padding: 16px; border-radius: 6px;
  background: #f5f5f5; border: 1px solid #e8e8e8;
  display: none; text-align: center;
}
.result.show { display: block; }
.result .code {
  font-size: 22px; font-weight: 600; font-family: 'SF Mono', 'Menlo', monospace;
  color: #222; letter-spacing: 0.15em; margin: 8px 0;
  user-select: all; word-break: break-all;
}
.result .hint { font-size: 11px; color: #999; margin-top: 8px; }
.copy-btn {
  margin-top: 10px; padding: 6px 18px; font-size: 12px;
  border: 1px solid #ccc; border-radius: 4px; background: #fff;
  cursor: pointer; color: #555; transition: all .2s;
}
.copy-btn:hover { border-color: #888; color: #222; }
.copy-btn.copied { background: #e8f5e9; border-color: #66bb6a; color: #2e7d32; }
.error { color: #d32f2f; font-size: 12px; margin-top: 6px; display: none; }
.error.show { display: block; }
.amount-group { display: flex; gap: 8px; }
.amount-group select { width: auto; flex-shrink: 0; }
.amount-group input { flex: 1; }
.tip { font-size: 11px; color: #bbb; text-align: center; margin-top: 20px; }
</style>
</head>
<body>

<div class="card">
  <h1>生成充值码</h1>

  <div class="field">
    <label for="secret">密钥 (REDEEM_SECRET)</label>
    <input type="password" id="secret" value="my-redeem-secret-change-me" autocomplete="off">
  </div>

  <div class="field">
    <label>金额</label>
    <div class="amount-group">
      <select id="amountPreset">
        <option value="">自定义</option>
        <option value="5">¥5</option>
        <option value="10" selected>¥10</option>
        <option value="30">¥30</option>
        <option value="50">¥50</option>
      </select>
      <input type="number" id="customAmount" min="1" value="10" placeholder="输入金额">
    </div>
  </div>

  <button class="btn" id="generateBtn">生成充值码</button>

  <div class="result" id="result">
    <div style="font-size:11px;color:#999;margin-bottom:4px;">充值码</div>
    <div class="code" id="codeDisplay"></div>
    <button class="copy-btn" id="copyBtn">复制</button>
    <div class="hint">发给用户，让对方在 Lobby 输入兑换</div>
  </div>

  <div class="error" id="error"></div>

  <div class="tip">生成的码不需要联网验证，本地算法计算</div>
</div>

<script>
async function generateCode(secret, amount) {
  const encoder = new TextEncoder()
  const keyData = encoder.encode(secret)
  const msgData = encoder.encode(`${amount}-${nonce()}`)

  const key = await crypto.subtle.importKey(
    'raw', keyData, { name: 'HMAC', hash: 'SHA-256' },
    false, ['sign']
  )
  const sig = await crypto.subtle.sign('HMAC', key, msgData)
  const hex = Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('')
  return `IM${amount}${nonceStr}${hex.substring(0, 4).toUpperCase()}`
}

function nonce() {
  const bytes = new Uint8Array(3)
  crypto.getRandomValues(bytes)
  nonceStr = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase()
  return nonceStr
}

let nonceStr = ''
let lastCode = ''

const secretInput = document.getElementById('secret')
const amountPreset = document.getElementById('amountPreset')
const customAmount = document.getElementById('customAmount')
const generateBtn = document.getElementById('generateBtn')
const resultDiv = document.getElementById('result')
const codeDisplay = document.getElementById('codeDisplay')
const copyBtn = document.getElementById('copyBtn')
const errorDiv = document.getElementById('error')

amountPreset.addEventListener('change', () => {
  if (amountPreset.value) {
    customAmount.value = amountPreset.value
  }
})

generateBtn.addEventListener('click', async () => {
  const secret = secretInput.value.trim()
  if (!secret) {
    showError('请输入密钥')
    return
  }

  const amount = parseInt(customAmount.value)
  if (!amount || amount <= 0) {
    showError('请输入有效金额')
    return
  }

  try {
    const code = await generateCode(secret, amount)
    lastCode = code
    codeDisplay.textContent = code
    resultDiv.classList.add('show')
    errorDiv.classList.remove('show')
    copyBtn.textContent = '复制'
    copyBtn.classList.remove('copied')
  } catch (e) {
    showError('生成失败: ' + e.message)
  }
})

copyBtn.addEventListener('click', async () => {
  if (!lastCode) return
  try {
    await navigator.clipboard.writeText(lastCode)
    copyBtn.textContent = '已复制 ✓'
    copyBtn.classList.add('copied')
  } catch {
    // fallback
    const ta = document.createElement('textarea')
    ta.value = lastCode
    document.body.appendChild(ta)
    ta.select()
    document.execCommand('copy')
    document.body.removeChild(ta)
    copyBtn.textContent = '已复制 ✓'
    copyBtn.classList.add('copied')
  }
})

function showError(msg) {
  errorDiv.textContent = msg
  errorDiv.classList.add('show')
  resultDiv.classList.remove('show')
}

// Enter key to generate
customAmount.addEventListener('keydown', (e) => { if (e.key === 'Enter') generateBtn.click() })
secretInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generateBtn.click() })
</script>
</body>
</html>
